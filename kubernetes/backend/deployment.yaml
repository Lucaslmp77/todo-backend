apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: IMAGE_PLACEHOLDER # Será substituído pela pipeline
        ports:
        - containerPort: 3000 # Porta que sua API Node escuta